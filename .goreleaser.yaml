version: 2

project_name: concept2upload

before:
  hooks:
    - go mod tidy

builds:
  - id: concept2upload
    main: ./cmd/concept2upload
    binary: concept2upload
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Ad-hoc signing alone isn't enough: macOS's syspolicyd runs an XProtect
# scan on any unnotarized downloaded binary and silently trashes it if
# nothing answers the (non-interactive, so unanswerable) Gatekeeper
# prompt. Real Developer ID signing + notarization is required for a
# downloaded macOS binary to actually run. Uses quill under the hood.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        # A brand-new API key's first submission can queue for a long
        # time on Apple's side (v0.2.3's release hit a 10m timeout after
        # sitting at "notarizing and waiting" for the full 10m9s), so
        # give it more headroom. 20m is the max GoReleaser allows here -
        # Apple rejects longer-lived auth tokens outright.
        timeout: 20m

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

homebrew_casks:
  - name: concept2upload
    binaries:
      - concept2upload
    repository:
      owner: eoinaokane
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/eoinaokane/concept2upload"
    description: "Download Concept2 logbook workouts as Garmin-compatible TCX files and upload them to Strava"
