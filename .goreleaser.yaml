version: 2

project_name: concept2garmin

before:
  hooks:
    - go mod tidy

builds:
  - id: concept2garmin
    main: ./cmd/concept2garmin
    binary: concept2garmin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      # macOS refuses to execute a completely unsigned arm64/amd64 binary
      # at all (a hard kernel-level check, not just a Gatekeeper warning),
      # so ad-hoc sign every darwin build; other GOOS targets are a no-op.
      post:
        - cmd: sh -c 'case "{{ .Target }}" in darwin_*) codesign --force --sign - "{{ .Path }}" ;; esac'

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

homebrew_casks:
  - name: concept2garmin
    binaries:
      - concept2garmin
    repository:
      owner: eoinaokane
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/eoinaokane/concept2garmin"
    description: "List and download Concept2 logbook workouts as Garmin-compatible TCX files"
