version: 2

project_name: concept2garmin

before:
  hooks:
    - go mod tidy

builds:
  - id: concept2garmin
    main: ./cmd/concept2garmin
    binary: concept2garmin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Ad-hoc signing alone isn't enough: macOS's syspolicyd runs an XProtect
# scan on any unnotarized downloaded binary and silently trashes it if
# nothing answers the (non-interactive, so unanswerable) Gatekeeper
# prompt. Real Developer ID signing + notarization is required for a
# downloaded macOS binary to actually run. Uses quill under the hood.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 10m

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

homebrew_casks:
  - name: concept2garmin
    binaries:
      - concept2garmin
    repository:
      owner: eoinaokane
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/eoinaokane/concept2garmin"
    description: "List and download Concept2 logbook workouts as Garmin-compatible TCX files"
